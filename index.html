function showLogin(m="",mm){const pe=$("#le")?$("#le").value:"";if(mm)mode=mm;const up=mode==="up";$("#nav").innerHTML="";$("#seg").innerHTML="";$("#main").innerHTML=`<div class=card><h3>${up?"Créer mon compte":"Connexion"}</h3><label>E-mail</label><input id=le type=email autocomplete=username><label>Mot de passe (6 caractères minimum)</label><div class=pw><input id=lp type=password autocomplete="${up?"new-password":"current-password"}"><button class=ic type=button onclick="eye('lp')">👁</button></div>${up?`<label>Confirmer le mot de passe</label><div class=pw><input id=lp2 type=password autocomplete=new-password><button class=ic type=button onclick="eye('lp2')">👁</button></div>`:""}<div class=neg style="margin:8px 0">${m}</div><button class=btn style="width:100%" onclick="login()">${up?"Créer mon compte":"Se connecter"}</button><button class="btn g" style="width:100%;margin-top:8px" onclick="showLogin('',mode==='up'?'in':'up')">${up?"J’ai déjà un compte":"Créer mon compte"}</button>${up?"":`<button class="btn g" style="width:100%;margin-top:8px" onclick="forgot()">Mot de passe oublié</button>`}</div>`;$("#le").value=pe}
function eye(id){const i=$("#"+id);i.type=i.type==="password"?"text":"password"}
async function forgot(){const e=$("#le").value.trim();if(!e){showLogin("Saisissez d’abord votre e-mail.");return}try{await auth.sendPasswordResetEmail(e);showLogin("E-mail de réinitialisation envoyé.")}catch(x){showLogin("Échec : "+x.code)}}
async function login(){const e=$("#le").value.trim(),p=$("#lp").value;if(mode==="up"&&p!==$("#lp2").value){showLogin("Les deux mots de passe sont différents.");return}try{await(mode==="up"?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p))}catch(x){showLogin("Échec : "+({"auth/invalid-credential":"e-mail ou mot de passe incorrect","auth/email-already-in-use":"compte déjà créé, connectez-vous","auth/weak-password":"mot de passe trop court","auth/invalid-email":"e-mail invalide"}[x.code]||x.code))}}
function deny(e){if(!auth.currentUser||(e&&e.code&&e.code!=="permission-denied"))return;dead=true;$("#nav").innerHTML="";$("#seg").innerHTML="";$("#main").innerHTML=`<div class=card>Accès non autorisé pour ${esc(me)}. Demandez à être invité(e).<br><br><button class=btn onclick="logout()">Se déconnecter</button></div>`}
function start(u){uid=u.uid;me=u.email.toLowerCase();db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 const C=n=>db.collection(n),S=(q,f)=>unsubs.push(q.onSnapshot(f,deny));
 S(C("horses"),s=>{s.docs.forEach(d=>H[d.id]=d.data());render()});
 S(C("expenses"),s=>{X=s.docs.map(d=>({id:d.id,...d.data()}));render()});
 S(C("events"),s=>{E=s.docs.map(d=>({id:d.id,...d.data()}));render()});
 S(C("settings"),s=>{const d=s.docs.find(x=>x.id==="people");P=d?(d.data().list||[]):[];render()});
 S(C("data/users/"+uid).doc("prefs"),s=>{if(s.exists){const o=s.data().order;if(o&&o.length===4)order=o}render()});
 if(me===OWNER.toLowerCase())S(C("allowed"),s=>{A=s.docs.map(d=>d.id);if($("#modal").style.display==="flex"&&$("#mb").innerHTML.includes("Invités"))openSet()});
 render(1)}
function go(){render(1);scrollTo(0,0)}
function render(f){if(dead||!db)return;
 const a=document.activeElement;if(!f&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="checkbox"&&a.closest("#main"))return;
 $("#seg").innerHTML=Object.keys(NM).map(k=>`<button class="${k===cur?"on":""}" onclick="cur='${k}';go()">${NM[k]}</button>`).join("");
 $("#nav").innerHTML=order.map(t=>`<button class="${t===tab?"on":""}" onclick="tab='${t}';go()"><span>${TB[t][1]}</span>${TB[t][0]}</button>`).join("");
 $("#main").innerHTML={desc:vDesc,med:vMed,dep:vDep,cal:vCal}[tab]();
}
/* champs */
function fld(k,l,type="text",opts){const v=(H[cur]||{})[k]??"",n=(H[cur]||{})[k+"_n"]??"";
 const inp=opts?`<select onchange="sv('${k}',this.value)"><option value="">—</option>${opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`:
 type==="area"?`<textarea rows=3 onchange="sv('${k}',this.value)">${esc(v)}</textarea>`:`<input type="${type}" value="${esc(v)}" onchange="sv('${k}',this.value)">`;
 return `<label>${l}</label>${inp}${type==="area"?"":`<input class="n" placeholder="Remarque…" value="${esc(n)}" onchange="sv('${k}_n',this.value)">`}`}
function sv(k,v){H[cur]={...H[cur],[k]:v};db.collection("horses").doc(cur).set(H[cur])}
function age(d){if(!d)return"—";const b=new Date(d),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0)return"—";const y=Math.floor(m/12);return(y?y+" an"+(y>1?"s":""):"")+(y&&m%12?" et ":"")+(m%12||!y?m%12+" mois":"")}
function vDesc(){const h=H[cur]||{};return `<div class=card>${h.photo?`<img class=photo src="${h.photo}">`:`<div class=photo></div>`}
 <div style="text-align:center"><label class="btn g" style="display:inline-block;color:var(--ac);font-size:14px">📷 Photo<input type=file accept="image/*" hidden onchange="photo(this)"></label></div>
 ${fld("nom","Nom complet")}${fld("statut","OC / ONC","text",["OC","ONC"])}${fld("naissance","Date de naissance","date")}
 <label>Âge (calculé)</label><div class=big>${age(h.naissance)}</div>
 ${fld("sire","N° SIRE")}${fld("robe","Couleur de robe")}${fld("assur","Nom de l’assurance")}${fld("contrat","N° de contrat d’assurance")}${fld("notes","Notes","area")}</div>`}
function photo(el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,360/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);sv("photo",c.toDataURL("image/jpeg",.7));render(1)};im.src=URL.createObjectURL(f)}
function vMed(){const t=(H[cur]||{}).tiles||[];return `
 <div class=card><h3>Vaccins</h3>${fld("vac_d","Date du dernier vaccin","date")}${fld("vac_t","Type de vaccin")}${fld("grippe","Grippe équine","text",["Oui","Non"])}</div>
 <div class=card><h3>Vermifuge</h3>${fld("ver_d","Dernier vermifuge","date")}${fld("ver_n","Nom du vermifuge")}</div>
 <div class=card><h3>Soins & visites</h3>${fld("cast","Date de castration","date")}${fld("mar","Dernière visite maréchal","date")}${fld("oste","Dernière visite ostéopathe","date")}${fld("dent","Dernière visite dentiste","date")}</div>
 ${t.map((x,i)=>`<div class=card><input placeholder="Titre (ex. Radio, Allergie…)" style="font-weight:700" value="${esc(x.t)}" onchange="tl(${i},'t',this.value)"><label>Valeur / date</label><input value="${esc(x.v)}" onchange="tl(${i},'v',this.value)"><label>Remarque</label><textarea rows=2 onchange="tl(${i},'n',this.value)">${esc(x.n)}</textarea><button class="btn d" style="margin-top:8px" onclick="if(confirm('Supprimer cette tuile ?'))tl(${i})">Supprimer</button></div>`).join("")}
 <button class=btn style="width:100%" onclick="tl(-1)">＋ Ajouter une tuile</button>`}
function tl(i,f,v){const t=[...((H[cur]||{}).tiles||[])];if(i===-1)t.push({t:"",v:"",n:""});else if(!f)t.splice(i,1);else t[i]={...t[i],[f]:v};sv("tiles",t);if(i===-1||!f)render(1)}
/* dépenses */
const inH=(x)=>x.h==="both"||x.h===cur;
function bal(list){const m={};list.forEach(x=>{const s=(x.split&&x.split.length)?x.split:[x.payer],sh=x.price/s.length;s.forEach(p=>{if(p===x.payer||(x.paid||[]).includes(p))return;const k=p+"|"+x.payer;m[k]=(m[k]||0)+sh})});
 const out=[];Object.keys(m).forEach(k=>{const [a,b]=k.split("|"),v=m[k]-(m[b+"|"+a]||0);if(v>0.004)out.push(`${a} doit ${eur(v)} à ${b}`)});return out}
function dbt(x){const s=x.split||[],sh=x.price/(s.length||1),pd=x.paid||[];const l=s.map((p,i)=>p===x.payer?"":`<label><input type=checkbox ${pd.includes(p)?"checked":""} onchange="tg('${x.id}',${i},this.checked)">${esc(p)} · ${eur(sh)}</label>`).join("");return l?`<div class=chk style="padding-bottom:8px"><span class=mu>Remboursé à ${esc(x.payer)} :</span>${l}</div>`:""}
function tg(id,i,c){const x=X.find(y=>y.id===id),p=x.split[i],F=firebase.firestore.FieldValue;db.collection("expenses").doc(id).update({paid:c?F.arrayUnion(p):F.arrayRemove(p)})}
function vDep(){const all=[...X].sort((a,b)=>(b.d||"").localeCompare(a.d||""));const tot=X.reduce((s,x)=>s+x.price,0),paid={};X.forEach(x=>paid[x.payer]=(paid[x.payer]||0)+x.price);const r=bal(X);
 return `<div class=card><h3>Remboursements (tous chevaux)</h3>${r.length?r.map(x=>`<div class=row>${esc(x)}</div>`).join(""):`<div class=mu>Rien à rembourser.</div>`}
 <div class=mu style="margin-top:6px">Total : ${eur(tot)} — ${Object.entries(paid).map(([p,v])=>esc(p)+" a payé "+eur(v)).join(" · ")}</div></div>
 <div class=card><h3>Personnes</h3>${P.map((p,i)=>`<div class=row><input value="${esc(p)}" onchange="pe(${i},this.value)"><button class="btn d" onclick="pe(${i})">✕</button></div>`).join("")}<button class="btn g" onclick="pe(-1)">＋ Ajouter une personne</button></div>
 <button class=btn style="width:100%;margin-bottom:12px" onclick="openX()">＋ Nouvelle dépense</button>
 <div class=card><h3>Dépenses de ${NM[cur]} <span class=mu>(${eur(all.filter(inH).reduce((s,x)=>s+x.price,0))})</span></h3>${all.filter(inH).map(x=>`<div class=ex><div class=row onclick="openX('${x.id}')"><div><b>${esc(x.n)}</b><div class=mu>${fd(x.d)} · payé par ${esc(x.payer)}${x.h==="both"?" · les deux":""}${x.note?" · "+esc(x.note):""}</div></div><b>${eur(x.price)}</b></div>${dbt(x)}</div>`).join("")||`<div class=mu>Aucune dépense.</div>`}</div>`}
function pe(i,v){const l=[...P];if(i===-1){const n=prompt("Prénom ?");if(!n)return;l.push(n)}else if(v===undefined)l.splice(i,1);else l[i]=v;db.collection("settings").doc("people").set({list:l})}
function openM(h){$("#mb").innerHTML=h;$("#modal").style.display="flex"}function closeM(){$("#modal").style.display="none"}
function openX(id){if(!P.length){alert("Ajoutez d’abord les personnes (bloc « Personnes »).");return}
 const x=X.find(y=>y.id===id)||{n:"",price:"",payer:P[0],split:[...P],d:new Date().toISOString().slice(0,10),h:cur,note:""};
 openM(`<h3>${id?"Modifier":"Nouvelle"} dépense</h3><label>Nom</label><input id=xn value="${esc(x.n)}"><label>Prix (€)</label><input id=xp type=number step=0.01 inputmode=decimal value="${x.price}"><label>Payé par</label><select id=xq>${P.map(p=>`<option ${p===x.payer?"selected":""}>${esc(p)}</option>`).join("")}</select>
 <label>Partagée entre</label><div class=chk>${P.map(p=>`<label><input type=checkbox class=xs value="${esc(p)}" ${(x.split||[]).includes(p)?"checked":""}>${esc(p)}</label>`).join("")}</div>
 <label>Cheval</label><select id=xh>${[["mikado","Mikado"],["larsen","Larsen"],["both","Les deux"]].map(([k,l])=>`<option value=${k} ${k===x.h?"selected":""}>${l}</option>`).join("")}</select><label>Date</label><input id=xd type=date value="${x.d}"><label>Remarque</label><input id=xo value="${esc(x.note)}">
 <div style="display:flex;gap:8px;margin-top:14px"><button class=btn onclick="saveX('${id||""}')">Enregistrer</button><button class="btn g" onclick="closeM()">Annuler</button>${id?`<button class="btn d" onclick="if(confirm('Supprimer ?')){db.collection('expenses').doc('${id}').delete();closeM()}">Suppr.</button>`:""}</div>`)}
function saveX(id){const n=$("#xn").value.trim(),p=parseFloat($("#xp").value);if(!n||isNaN(p)){alert("Nom et prix requis");return}
 const sp=[...document.querySelectorAll(".xs:checked")].map(e=>e.value),pay=$("#xq").value,old=X.find(y=>y.id===id)||{};db.collection("expenses").doc(id||rid()).set({n,price:p,payer:pay,split:sp,paid:(old.paid||[]).filter(q=>sp.includes(q)&&q!==pay),h:$("#xh").value,d:$("#xd").value,note:$("#xo").value});closeM()}
/* agenda */
const dt=(d,t)=>d.replace(/-/g,"")+(t?"T"+t.replace(":","")+"00":"");
function vCal(){const l=E.filter(e=>e.h==="both"||e.h===cur).sort((a,b)=>(a.d+(a.t||"")).localeCompare(b.d+(b.t||"")));
 return `<button class=btn style="width:100%;margin-bottom:12px" onclick="openE()">＋ Nouvel évènement</button><div class=card>${l.map(e=>`<div class=row><div onclick="openE('${e.id}')" style="flex:1"><b>${esc(e.n)}</b><div class=mu>${fd(e.d)}${e.t?" à "+e.t:""}${e.h==="both"?" · les deux":""}${e.note?" · "+esc(e.note):""}</div></div><button class="btn g" onclick="ics('${e.id}')">📅 Agenda</button></div>`).join("")||`<div class=mu>Aucun évènement.</div>`}</div>`}
function openE(id){const e=E.find(y=>y.id===id)||{n:"",d:new Date().toISOString().slice(0,10),t:"",h:cur,note:""};
 openM(`<h3>${id?"Modifier":"Nouvel"} évènement</h3><label>Titre</label><input id=en value="${esc(e.n)}"><label>Date</label><input id=ed type=date value="${e.d}"><label>Heure (facultatif)</label><input id=et type=time value="${e.t||""}"><label>Cheval</label><select id=eh>${[["mikado","Mikado"],["larsen","Larsen"],["both","Les deux"]].map(([k,l])=>`<option value=${k} ${k===e.h?"selected":""}>${l}</option>`).join("")}</select><label>Remarque</label><input id=eo value="${esc(e.note)}">
 <div style="display:flex;gap:8px;margin-top:14px"><button class=btn onclick="saveE('${id||""}')">Enregistrer</button><button class="btn g" onclick="closeM()">Annuler</button>${id?`<button class="btn d" onclick="if(confirm('Supprimer ?')){db.collection('events').doc('${id}').delete();closeM()}">Suppr.</button>`:""}</div>`)}
function saveE(id){const n=$("#en").value.trim();if(!n||!$("#ed").value){alert("Titre et date requis");return}db.collection("events").doc(id||rid()).set({n,d:$("#ed").value,t:$("#et").value,h:$("#eh").value,note:$("#eo").value});closeM()}
function rng(e){if(!e.t)return[dt(e.d),dt(new Date(new Date(e.d+"T12:00").getTime()+864e5).toISOString().slice(0,10))];const[h,m]=e.t.split(":").map(Number);return[dt(e.d,e.t),dt(e.d,String(Math.min(h+1,23)).padStart(2,"0")+":"+String(m).padStart(2,"0"))]}
const gcal=e=>"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.n+" ("+(e.h==="both"?"Mikado & Larsen":NM[e.h])+")")+"&dates="+rng(e).join("/")+"&details="+encodeURIComponent(e.note||"");
function ics(id){const e=E.find(y=>y.id===id);if(!e)return;openM(`<h3>Ajouter à mon agenda</h3><div class=mu style="margin-bottom:10px">${esc(e.n)} · ${fd(e.d)}${e.t?" à "+e.t:""}</div><a class=btn style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" href="${gcal(e)}" target=_blank rel=noopener>Google Agenda</a><button class=btn style="width:100%;margin-bottom:8px" onclick="icsf('${id}')">Apple Agenda / autre (fichier .ics)</button><button class="btn g" style="width:100%" onclick="closeM()">Fermer</button>`)}
async function icsf(id){const e=E.find(y=>y.id===id),[s,en]=rng(e),a=!e.t;const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Grodudu//FR","BEGIN:VEVENT","UID:"+e.id+"@grodudu","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",a?"DTSTART;VALUE=DATE:"+s:"DTSTART:"+s,a?"DTEND;VALUE=DATE:"+en:"DTEND:"+en,"SUMMARY:"+e.n,"DESCRIPTION:"+(e.note||"").replace(/\n/g," "),"END:VEVENT","END:VCALENDAR"].join("\r\n");const f=new File([txt],"evenement.ics",{type:"text/calendar"});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(x){if(x.name==="AbortError")return}const l=document.createElement("a");l.href=URL.createObjectURL(f);l.download="evenement.ics";document.body.appendChild(l);l.click();l.remove()}
/* réglages */
function openSet(){const ow=me===OWNER.toLowerCase();openM(`<h3>Ordre de mes onglets</h3><div class=mu style="margin-bottom:8px">Ce réglage est personnel.</div>${order.map((t,i)=>`<div class=row><span>${TB[t][1]} ${TB[t][0]}</span><span><button class="btn g" onclick="mv(${i},-1)">↑</button> <button class="btn g" onclick="mv(${i},1)">↓</button></span></div>`).join("")}<h3 style="margin-top:16px">Thème (sur cet appareil)</h3><div style="display:flex;gap:8px"><button class="btn g" style="flex:1" onclick="th('')">Auto</button><button class="btn g" style="flex:1" onclick="th('light')">Clair</button><button class="btn g" style="flex:1" onclick="th('dark')">Sombre</button></div>${ow?`<h3 style="margin-top:16px">Invités</h3>${A.map(e=>`<div class=row><span>${esc(e)}</span><button class="btn d" onclick="uninv('${esc(e)}')">✕</button></div>`).join("")||"<div class=mu>Personne pour l’instant.</div>"}<input id=ie type=email placeholder="e-mail à inviter" style="margin-top:8px"><button class="btn g" style="width:100%;margin-top:8px" onclick="inv()">Inviter</button>`:""}<button class="btn g" style="width:100%;margin-top:12px" onclick="logout();closeM()">Se déconnecter</button><button class=btn style="width:100%;margin-top:8px" onclick="closeM()">Fermer</button>`)}
function th(v){try{v?localStorage.setItem("th",v):localStorage.removeItem("th")}catch(e){}if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme}
function inv(){const e=$("#ie").value.trim().toLowerCase();if(e)db.collection("allowed").doc(e).set({t:Date.now()})}
function uninv(e){if(confirm("Retirer "+e+" ?"))db.collection("allowed").doc(e).delete()}
function mv(i,d){const j=i+d;if(j<0||j>3)return;const o=[...order];[o[i],o[j]]=[o[j],o[i]];order=o;if(uid)db.collection("data/users/"+uid).doc("prefs").set({order:o});render(1);openSet()}
</script></body></html>
